[project]
name = "book-recommendations-lakehouse"
version = "0.1.0"
description = "Book recommendations lakehouse"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "tenacity"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipykernel>=6.29",
    "pyspark"
]

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/books_dataset"]