resources:
  jobs:
    books_dataset_ingestion_pipeline:
      name: "Books Dataset Ingestion Pipeline"
      tags:
        environment: ${bundle.target}
        dataset: "books_dataset"
        layer: "multi-layer"
      trigger:
        file_arrival:
          url: /Volumes/${var.catalog}/bronze/landing/
        pause_status: UNPAUSED

      environments:
        - environment_key: pyspark_env
          spec:
            environment_version: "2"
            dependencies: []

      tasks:
        - task_key: books_autoloader
          environment_key: pyspark_env
          spark_python_task:
            python_file: ../src/books_dataset/bronze/autoloader.py
            parameters:
              - "--dataset-dir"
              - "/Volumes/${var.catalog}/bronze/landing/books"
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "bronze"
              - "--table"
              - "books_raw"
              - "--checkpoint-dir"
              - "/Volumes/${var.catalog}/bronze/checkpoints/books"
              - "--schema-dir"
              - "/Volumes/${var.catalog}/bronze/schemas/books"
        - task_key: ratings_autoloader
          environment_key: pyspark_env
          spark_python_task:
            python_file: ../src/books_dataset/bronze/autoloader.py
            parameters:
              - "--dataset-dir"
              - "/Volumes/${var.catalog}/bronze/landing/ratings"
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "bronze"
              - "--table"
              - "ratings_raw"
              - "--checkpoint-dir"
              - "/Volumes/${var.catalog}/bronze/checkpoints/ratings"
              - "--schema-dir"
              - "/Volumes/${var.catalog}/bronze/schemas/ratings"
        - task_key: users_autoloader
          environment_key: pyspark_env
          spark_python_task:
            python_file: ../src/books_dataset/bronze/autoloader.py
            parameters:
              - "--dataset-dir"
              - "/Volumes/${var.catalog}/bronze/landing/users"
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "bronze"
              - "--table"
              - "users_raw"
              - "--checkpoint-dir"
              - "/Volumes/${var.catalog}/bronze/checkpoints/users"
              - "--schema-dir"
              - "/Volumes/${var.catalog}/bronze/schemas/users"
        - task_key: books_silver
          depends_on:
            - task_key: books_autoloader
          pipeline_task:
            pipeline_id: ${resources.pipelines.books_silver_pipeline.id}
        - task_key: ratings_silver
          depends_on:
            - task_key: ratings_autoloader
          pipeline_task:
            pipeline_id: ${resources.pipelines.ratings_silver_pipeline.id}
        - task_key: users_silver
          depends_on:
            - task_key: users_autoloader
          pipeline_task:
            pipeline_id: ${resources.pipelines.users_silver_pipeline.id}
        - task_key: books_rating_stats_gold
          depends_on:
            - task_key: books_silver
            - task_key: ratings_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.books_rating_stats_gold_pipeline.id}
        - task_key: refresh_dashboard
          depends_on:
            - task_key: books_rating_stats_gold
            - task_key: users_silver
          dashboard_task:
            dashboard_id: ${resources.dashboards.books_overview.id}
